stages:
  - build
  - test
  - package
  - release

image: ubuntu:22.04

# ---- Build: Linux amd64 ----
build:linux-amd64:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake gcc make
  script:
    - cmake -B build -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=install
    - cmake --build build --config Release
    - cmake --install build --config Release --prefix install
  artifacts:
    paths:
      - build/
      - install/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Test: Linux amd64 ----
test:linux-amd64:
  stage: test
  needs:
    - job: build:linux-amd64
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y cmake
  script:
    - ctest --test-dir build --output-on-failure
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Build: Windows amd64 (MinGW cross-compile) ----
build:windows-amd64:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake make mingw-w64
  script:
    - cmake -B build -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=install
    - cmake --build build --config Release
    - cmake --install build --config Release --prefix install
  artifacts:
    paths:
      - install/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Build: Linux arm64 (cross-compile) ----
build:linux-arm64:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake gcc-aarch64-linux-gnu make
  script:
    - cmake -B build -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=install
    - cmake --build build --config Release
    - cmake --install build --config Release --prefix install
  artifacts:
    paths:
      - install/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Build: Linux armhf (cross-compile) ----
build:linux-armhf:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake gcc-arm-linux-gnueabihf make
  script:
    - cmake -B build -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=install
    - cmake --build build --config Release
    - cmake --install build --config Release --prefix install
  artifacts:
    paths:
      - install/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Package: Linux amd64 ----
package:linux-amd64:
  stage: package
  needs:
    - job: build:linux-amd64
      artifacts: true
    - job: test:linux-amd64
      artifacts: false
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKGNAME="libartnet-${VERSION}-linux-amd64"
    - mv install "${PKGNAME}"
    - tar czf "${PKGNAME}.tar.gz" "${PKGNAME}"
  artifacts:
    paths:
      - libartnet-*-linux-amd64.tar.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Package: Windows amd64 ----
package:windows-amd64:
  stage: package
  needs:
    - job: build:windows-amd64
      artifacts: true
    - job: test:linux-amd64
      artifacts: false
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKGNAME="libartnet-${VERSION}-windows-amd64"
    - mv install "${PKGNAME}"
    - tar czf "${PKGNAME}.tar.gz" "${PKGNAME}"
  artifacts:
    paths:
      - libartnet-*-windows-amd64.tar.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Package: Linux arm64 ----
package:linux-arm64:
  stage: package
  needs:
    - job: build:linux-arm64
      artifacts: true
    - job: test:linux-amd64
      artifacts: false
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKGNAME="libartnet-${VERSION}-linux-arm64"
    - mv install "${PKGNAME}"
    - tar czf "${PKGNAME}.tar.gz" "${PKGNAME}"
  artifacts:
    paths:
      - libartnet-*-linux-arm64.tar.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Package: Linux armhf ----
package:linux-armhf:
  stage: package
  needs:
    - job: build:linux-armhf
      artifacts: true
    - job: test:linux-amd64
      artifacts: false
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKGNAME="libartnet-${VERSION}-linux-armhf"
    - mv install "${PKGNAME}"
    - tar czf "${PKGNAME}.tar.gz" "${PKGNAME}"
  artifacts:
    paths:
      - libartnet-*-linux-armhf.tar.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Upload ----
package:generic:
  stage: release
  needs:
    - package:linux-amd64
    - package:linux-arm64
    - package:linux-armhf
    - package:windows-amd64
  before_script:
    - apt-get update && apt-get install -y curl
  script:
    - |
      for f in libartnet-*.tar.gz; do
        echo "Uploading $f to Generic Package Registry..."
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/$f"
      done
  rules:
    - if: $CI_COMMIT_TAG

# ---- Release ----
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package:generic
      artifacts: false
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      release-cli create \
        --name "libartnet ${CI_COMMIT_TAG}" \
        --description "libartnet ${CI_COMMIT_TAG}: Art-Net 4 focused release covering discovery, 15-bit addressing, DMX/Sync/NZS, remote programming, RDM/TOD, diagnostics, timecode/timesync/trigger, directory/file workflows, and layered controller/node examples." \
        --assets-link "{\"name\":\"libartnet-${VERSION}-linux-amd64.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/libartnet-${VERSION}-linux-amd64.tar.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"libartnet-${VERSION}-linux-arm64.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/libartnet-${VERSION}-linux-arm64.tar.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"libartnet-${VERSION}-linux-armhf.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/libartnet-${VERSION}-linux-armhf.tar.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"libartnet-${VERSION}-windows-amd64.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/libartnet-${VERSION}-windows-amd64.tar.gz\",\"link_type\":\"package\"}"
  rules:
    - if: $CI_COMMIT_TAG
