stages:
  - build
  - release

image: ubuntu:22.04

# ---- Linux amd64 ----
build:linux-amd64:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake gcc make
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - cmake -B build -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=install
    - cmake --build build --config Release
    - cmake --install build --config Release --prefix install
    - PKGNAME="libartnet-${VERSION}-linux-amd64"
    - mv install "${PKGNAME}"
    - tar czf "${PKGNAME}.tar.gz" "${PKGNAME}"
  artifacts:
    paths:
      - libartnet-*.tar.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Windows amd64 (MinGW cross-compile) ----
build:windows-amd64:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake make mingw-w64
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      cmake -B build
      -DCMAKE_SYSTEM_NAME=Windows
      -DCMAKE_SYSTEM_PROCESSOR=x86_64
      -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
      -DBUILD_SHARED_LIBS=ON
      -DBUILD_EXAMPLES=OFF
      -DCMAKE_INSTALL_PREFIX=install
    - cmake --build build --config Release
    - cmake --install build --config Release --prefix install
    - PKGNAME="libartnet-${VERSION}-windows-amd64"
    - mv install "${PKGNAME}"
    - tar czf "${PKGNAME}.tar.gz" "${PKGNAME}"
  artifacts:
    paths:
      - libartnet-*.tar.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Linux arm64 (cross-compile) ----
build:linux-arm64:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake gcc-aarch64-linux-gnu make
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      cmake -B build
      -DCMAKE_SYSTEM_NAME=Linux
      -DCMAKE_SYSTEM_PROCESSOR=aarch64
      -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
      -DBUILD_SHARED_LIBS=ON
      -DBUILD_EXAMPLES=OFF
      -DCMAKE_INSTALL_PREFIX=install
    - cmake --build build --config Release
    - cmake --install build --config Release --prefix install
    - PKGNAME="libartnet-${VERSION}-linux-arm64"
    - mv install "${PKGNAME}"
    - tar czf "${PKGNAME}.tar.gz" "${PKGNAME}"
  artifacts:
    paths:
      - libartnet-*.tar.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Linux armhf (cross-compile) ----
build:linux-armhf:
  stage: build
  before_script:
    - apt-get update && apt-get install -y cmake gcc-arm-linux-gnueabihf make
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      cmake -B build
      -DCMAKE_SYSTEM_NAME=Linux
      -DCMAKE_SYSTEM_PROCESSOR=arm
      -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
      -DBUILD_SHARED_LIBS=ON
      -DBUILD_EXAMPLES=OFF
      -DCMAKE_INSTALL_PREFIX=install
    - cmake --build build --config Release
    - cmake --install build --config Release --prefix install
    - PKGNAME="libartnet-${VERSION}-linux-armhf"
    - mv install "${PKGNAME}"
    - tar czf "${PKGNAME}.tar.gz" "${PKGNAME}"
  artifacts:
    paths:
      - libartnet-*.tar.gz
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- Package & Upload ----
package:generic:
  stage: release
  needs:
    - build:linux-amd64
    - build:linux-arm64
    - build:linux-armhf
    - build:windows-amd64
  before_script:
    - apt-get update && apt-get install -y curl
  script:
    - |
      for f in libartnet-*.tar.gz; do
        echo "Uploading $f to Generic Package Registry..."
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/$f"
      done
  rules:
    - if: $CI_COMMIT_TAG

# ---- Release ----
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package:generic
      artifacts: false
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      release-cli create \
        --name "libartnet ${CI_COMMIT_TAG}" \
        --description "libartnet ${CI_COMMIT_TAG} multi-platform release." \
        --assets-link "{\"name\":\"libartnet-${VERSION}-linux-amd64.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/libartnet-${VERSION}-linux-amd64.tar.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"libartnet-${VERSION}-linux-arm64.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/libartnet-${VERSION}-linux-arm64.tar.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"libartnet-${VERSION}-linux-armhf.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/libartnet-${VERSION}-linux-armhf.tar.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"libartnet-${VERSION}-windows-amd64.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/libartnet/${CI_COMMIT_TAG}/libartnet-${VERSION}-windows-amd64.tar.gz\",\"link_type\":\"package\"}"
  rules:
    - if: $CI_COMMIT_TAG
